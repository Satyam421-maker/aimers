<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2217%22%20fill%3D%22%2310203b%22%2F%3E%3Cpath%20d%3D%22M12%2047%2027%2014c1.8-4%207.2-4%209%200l16%2033h-9l-4-9H25l-4%209z%22%20fill%3D%22%23f7fbff%22%2F%3E%3Cpath%20d%3D%22m28.5%2030-3.8%208h14.6l-3.8-8-3.5-8z%22%20fill%3D%22%2320c6b1%22%2F%3E%3Cpath%20d%3D%22M32%2010v8%22%20stroke%3D%22%2320c6b1%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap">
<style>
:root{--bg:#f3f7ff;--card:#fff;--ink:#0f1b33;--mut:#4b5b78;--line:#d6e0f2;--acc:#1d4ed8;--acc-ink:#fff;--teal:#1fb5a6;--sun:#ffc83d;--okbg:#e2f6f3;--ok:#0f766e;--warnbg:#fff3cf;--badbg:#ffe8dc;--bad:#c2410c;--r:14px;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b14;--card:#0f1b33;--ink:#eaf2ff;--mut:#9fb0cf;--line:#22345a;--acc:#3b82f6;--okbg:#0e3a3a;--ok:#5eead4;--warnbg:#3b3210;--badbg:#40200f;--bad:#fb923c}}
:root[data-theme="dark"]{--bg:#070b14;--card:#0f1b33;--ink:#eaf2ff;--mut:#9fb0cf;--line:#22345a;--acc:#3b82f6;--okbg:#0e3a3a;--ok:#5eead4;--warnbg:#3b3210;--badbg:#40200f;--bad:#fb923c}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;min-height:100%}
html{scrollbar-width:thin;scrollbar-color:var(--acc) var(--bg);scroll-behavior:smooth}
*{scrollbar-width:thin;scrollbar-color:var(--acc) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:var(--bg);border-radius:999px}
*::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--mut) 72%,var(--acc));border:2px solid var(--bg);border-radius:999px;min-height:34px}
*::-webkit-scrollbar-thumb:hover{background:var(--acc)}
*::-webkit-scrollbar-corner{background:var(--bg)}

body{background:var(--bg);color:var(--ink);font:400 16px/1.6 Lexend,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:26px;line-height:1.25;margin:0 0 6px}h2{font-size:20px;margin:22px 0 8px}h3{font-size:16px;margin:0 0 4px}
a{color:var(--acc)}.mut{color:var(--mut)}.small{font-size:14px}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer;min-height:42px;margin:3px 3px 3px 0;text-decoration:none;display:inline-block}
button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.5;cursor:default}
.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:500}.sun{background:var(--sun);border-color:var(--sun);color:#1b2a3a;font-weight:600}.danger{color:var(--bad);border-color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0 12px}
input[type=checkbox],input[type=radio]{width:auto;margin:0 8px 0 0}textarea{min-height:120px}
label{font-size:14px;color:var(--mut);display:block}label.ck{display:flex;align-items:center;color:var(--ink);font-size:16px;padding:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>.grow{flex:1;min-width:160px}
.pill{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--okbg);color:var(--ok);border:1px solid var(--line);margin:2px 4px 2px 0}.pill.w{background:var(--warnbg);color:var(--ink)}.pill.b{background:var(--badbg);color:var(--bad)}
.err{background:var(--badbg);border-left:4px solid var(--bad);padding:8px 12px;border-radius:8px;margin:8px 0}.okb{background:var(--okbg);border-left:4px solid var(--teal);padding:8px 12px;border-radius:8px;margin:8px 0}.wn{background:var(--warnbg);border-left:4px solid var(--sun);padding:8px 12px;border-radius:8px;margin:8px 0}
table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:13px;color:var(--mut);font-weight:500}.scroll{overflow-x:auto}
/* app frame: sidebar on wide screens, bottom bar on phones */
.frame{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{font-weight:700;font-size:22px;padding:0 8px 14px}.logo b{color:var(--teal)}
.side a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;margin:2px 0}
.side a:hover{background:var(--bg)}.side a[aria-current=page]{background:var(--acc);color:var(--acc-ink);font-weight:500}
.side a.lo2{display:none}
.who{margin-top:18px;padding:12px;border-top:1px solid var(--line);font-size:14px}
.main{padding:22px clamp(14px,3vw,36px) 90px;max-width:1100px;width:100%}
.auth{max-width:420px;margin:8vh auto;padding:0 16px}
@media (max-width:760px){.frame{display:block}.side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;z-index:20;display:flex;gap:2px;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line)}
 .side .logo,.side .who{display:none}.side a.lo2{display:flex}.side a{flex-direction:column;gap:0;font-size:11px;padding:6px 10px;white-space:nowrap}.side a span.ic{font-size:20px}}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);padding:20px;max-width:min(520px,94vw);width:100%}dialog::backdrop{background:rgba(7,11,20,.55)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25)}#toast div.bad{background:var(--bad);color:#fff}
.ck .pill{margin-left:8px}
.empty{text-align:center;padding:36px 16px;color:var(--mut)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0}.prog i{display:block;height:100%;background:var(--teal);transition:width .3s}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);margin:6px 0}.opt.g{border-color:var(--teal);background:var(--okbg)}.opt.x{border-color:var(--bad);background:var(--badbg)}
.lvl{font-weight:600}.lvl.s{color:var(--ok)}.lvl.d{color:#a16207}.lvl.r{color:var(--bad)}
.player iframe{width:100%;height:min(72vh,760px);border:1px solid var(--line);border-radius:12px;background:#fff}

.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:8px 0}
.cell{min-width:0;overflow:hidden;min-height:74px;margin:0;padding:6px 4px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border-radius:10px;background:var(--card)}
.cell .chips{font-size:12px;line-height:1.2;letter-spacing:1px;display:flex;flex-wrap:wrap;max-width:100%}.cell .cp{font-size:11px;color:var(--mut)}
.cell.g{background:var(--okbg);border-color:var(--teal)}.cell.w{background:var(--warnbg);border-color:var(--sun)}.cell.b{background:var(--badbg);border-color:var(--bad)}
.cell.today{outline:2px solid var(--acc)}.cell.sel{box-shadow:0 0 0 3px var(--sun)}
@media (max-width:560px){.cell{min-height:56px;padding:4px 2px;align-items:center}.cell .chips{font-size:10px;letter-spacing:0;justify-content:center}.cell .cd{font-size:9px}.cell .cp{display:none}}
.cell .cd{font-style:normal;font-size:11px;font-weight:700;color:var(--acc);letter-spacing:0;margin-right:3px}

svg .b-s{fill:var(--teal)}svg .b-d{fill:var(--sun)}svg .b-r{fill:var(--bad)}svg .b-0{fill:var(--line)}svg .ax{stroke:var(--line);stroke-width:1}svg .tx{fill:var(--mut);font-size:11px}
.hm{border-collapse:separate;border-spacing:3px;width:auto}.hm th{font-size:12px;font-weight:500;max-width:96px;white-space:normal;vertical-align:bottom;padding:2px 4px}.hm td.hc{text-align:center;border-radius:6px;font-size:13px;min-width:46px;padding:7px 4px;border-bottom:0}
.hc-s{background:var(--okbg);color:var(--ok);font-weight:600}.hc-d{background:var(--warnbg);color:var(--ink)}.hc-r{background:var(--badbg);color:var(--bad);font-weight:600}.hc-0{background:var(--bg);color:var(--mut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}


</style>
</head>
<body>
<div id="app"><p style="padding:24px">Loading Aimers…</p></div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const __m_config = (() => {
// Fill these in from Supabase: Project Settings > API. The "anon" key is meant to be public.
// If you leave them empty, the site asks for them on first visit and remembers them in this browser.
const CONFIG = { url: "https://fqtvmcknrxnnpifmwefp.supabase.co", key: "sb_publishable_dACiaqrkg04RAZIUFd-5SQ_IcQTUwa4" };

return { CONFIG };
})();

const __m_core = (() => {
// Core helpers shared by every screen: the Supabase connection, the server calls, pop-ups and the router.

const { CONFIG } = __m_config;

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const VERSION = "1.0";
const diag = { errors: [], calls: [] }; // the last few problems, for the "Report a problem" button
const note = (a, v) => { a.push(new Date().toISOString().slice(11, 19) + " " + v); if (a.length > 12) a.shift(); };
addEventListener("error", (e) => note(diag.errors, (e.message || "error") + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : "")));
addEventListener("unhandledrejection", (e) => note(diag.errors, "promise: " + ((e.reason && e.reason.message) || e.reason)));
const S = { sb: null, user: null, me: null, activitySessionId: null, studentMode: false }; // teacher-only visual preview
const isTeacher = () => S.me && S.me.role === "teacher";

function loadConfig() {
  try { const c = window.AIMERS_CONFIG || (CONFIG.url && CONFIG.key ? CONFIG : null) || JSON.parse(localStorage.getItem("aimers_cfg") || "null"); return c && c.url && c.key ? c : null; } catch (e) { return null; }
}
const saveConfig = (c) => { try { localStorage.setItem("aimers_cfg", JSON.stringify(c)); } catch (e) { /* private mode */ } };
const connect = (c) => (S.sb = createClient(c.url, c.key));
const mail = (u) => String(u).trim().toLowerCase().replace(/[^a-z0-9._-]/g, "") + "@aimers.app"; // same login scheme as the old site

// Calls the server function (marking, tests, AI, admin). Shows the server's own plain-language error.
async function api(task, body = {}) {
  const r = await S.sb.functions.invoke("api", { body: { task, ...body } });
  if (r.error) {
    let m = r.error.message || "The server could not be reached."; note(diag.calls, task + " failed: " + m);
    try { const j = await r.error.context.json(); if (j && j.error) m = j.error; } catch (e) { /* keep m */ }
    if (/not found|404|Failed to send/i.test(m)) m = "The Aimers server function is not set up yet. Ask the teacher to deploy the 'api' function.";
    throw new Error(m);
  }
  if (r.data && r.data.error) { note(diag.calls, task + " refused: " + r.data.error); throw new Error(r.data.error); }
  note(diag.calls, task + " ok"); return r.data;
}
// Reads from a table and stops with a readable message instead of failing silently.
const activity = (event_type, fields = {}) => { if (!S.activitySessionId || !S.me || S.me.role === "teacher") return Promise.resolve(); return api("activity_event", { activity_session_id: S.activitySessionId, event_type, ...fields }).catch(() => {}); };
const need = (r) => { if (r.error) throw new Error(r.error.message); return r.data; };

function toast(msg, kind) {
  const box = $("#toast"), d = document.createElement("div"); d.textContent = msg; if (kind === "bad") d.className = "bad"; box.append(d); setTimeout(() => d.remove(), kind === "bad" ? 6000 : 3200);
}
// Pop-ups use the browser's own <dialog>, which traps focus and closes with Escape.
function dialog(html, onMount) {
  return new Promise((res) => {
    const d = document.createElement("dialog"); d.innerHTML = html; document.body.append(d);
    const done = (v) => { if (d.open) d.close(); d.remove(); res(v); };
    d.addEventListener("cancel", () => done(null)); d.addEventListener("close", () => { d.remove(); res(null); });
    d.addEventListener("click", (e) => { const a = e.target.closest("[data-act]"); if (a) done(a.dataset.act === "ok" ? (onMount && onMount.read ? onMount.read(d) : true) : null); });
    d.showModal(); const f = d.querySelector("input,textarea,select"); if (f) f.focus();
  });
}
const confirmBox = (msg, yes = "Yes") => dialog(`<h3>${esc(msg)}</h3><div class="row" style="margin-top:14px"><button class="pri" data-act="ok">${esc(yes)}</button><button data-act="no">Cancel</button></div>`);
const askBox = (title, label, o = {}) => dialog(`<h3>${esc(title)}</h3><label>${esc(label)}<input id="ab" type="${o.type || "text"}" value="${esc(o.value || "")}" autocomplete="off"></label><div class="row"><button class="pri" data-act="ok">${esc(o.ok || "Save")}</button><button data-act="no">Cancel</button></div>`, { read: (d) => d.querySelector("#ab").value.trim() || null });

// Router: #/teacher/students, #/learn, and so on. Screens register themselves with route().
const R = []; const route = (re, fn) => R.push([re, fn]);
const go = (p) => { if (location.hash === "#" + p) dispatchEvent(new HashChangeEvent("hashchange")); else location.hash = "#" + p; };
const here = () => (location.hash.replace(/^#/, "") || "/").split("?")[0];
const query = () => new URLSearchParams((location.hash.split("?")[1]) || "");
async function runRoute(fallback) {
  const p = here();
  for (const [re, fn] of R) { const m = p.match(re); if (m) { try { await fn(m); } catch (e) { console.error(e); note(diag.errors, "screen " + here() + ": " + (e.message || e)); const el = $("#view"); if (el) el.innerHTML = `<div class="err"><b>Something went wrong.</b> ${esc(e.message || e)}</div>`; } return; } }
  fallback();
}
const fmtDate = (iso) => (iso ? new Date(iso).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "");

return { $, $$, esc, VERSION, diag, S, isTeacher, loadConfig, saveConfig, connect, mail, api, activity, need, toast, dialog, confirmBox, askBox, route, go, here, query, runRoute, fmtDate };
})();

const __m_auth = (() => {
// Login, registration and the "waiting for approval" screen. Same username scheme as the old site.
const { $, S, esc, mail, need, toast } = __m_core;

async function loadMe() {
  const { data: { user } } = await S.sb.auth.getUser(); S.user = user || null; S.me = null; if (!user) return null;
  const r = await S.sb.from("profiles").select("*").eq("id", user.id).maybeSingle(); S.me = r.data || null; return S.me;
}
function authScreen(mode = "login") {
  const reg = mode === "register";
  $("#app").innerHTML = `<main class="auth"><div class="logo" style="font-size:30px;padding:0 0 10px">Aim<b style="color:var(--teal)">ers</b></div>
  <div class="card"><h1>${reg ? "Create your account" : "Welcome back"}</h1><p class="mut small">${reg ? "Your teacher will approve you before you can start." : "Log in with your username and password."}</p>
  <form id="af" novalidate>
   ${reg ? '<label for="dn">Your name</label><input id="dn" autocomplete="name" placeholder="e.g. Riya Sharma">' : ""}
   <label for="un">Username</label><input id="un" autocomplete="username" autocapitalize="none" spellcheck="false">
   <label for="pw">Password ${reg ? "(6 or more characters)" : ""}</label><input id="pw" type="password" autocomplete="${reg ? "new-password" : "current-password"}">
   <div id="ae" class="err" role="alert" hidden></div>
   <button class="pri" id="ab" style="width:100%">${reg ? "Create account" : "Log in"}</button></form>
  <p class="small" style="text-align:center">${reg ? 'Already have an account? <a href="#/login">Log in</a>' : 'New here? <a href="#/register">Create an account</a>'}</p></div></main>`;
  const fail = (m) => { const e = $("#ae"); e.textContent = m; e.hidden = false; $("#ab").disabled = false; };
  $("#af").addEventListener("submit", async (ev) => {
    ev.preventDefault(); const u = $("#un").value.trim(), pw = $("#pw").value; $("#ae").hidden = true;
    if (!u) return fail("Enter your username."); if (pw.length < 6) return fail("The password needs at least 6 characters.");
    $("#ab").disabled = true;
    try {
      let r;
      if (reg) {
        r = await S.sb.auth.signUp({ email: mail(u), password: pw, options: { data: { username: u, display_name: ($("#dn").value || "").trim() || u } } });
        if (r.error && /already/i.test(r.error.message)) return fail("That username is taken. Choose another, or log in.");
        if (!r.error && !r.data.session) return fail("The site still asks for email confirmation. Ask your teacher to turn that off in Supabase.");
      } else { r = await S.sb.auth.signInWithPassword({ email: mail(u), password: pw }); }
      if (r.error) return fail(reg ? r.error.message : "Wrong username or password.");
      location.hash = "#/"; location.reload();
    } catch (e) { fail(e.message || "Something went wrong. Check your internet and try again."); }
  });
}
function pendingScreen() {
  $("#app").innerHTML = `<main class="auth"><div class="card" style="text-align:center"><h1>Almost there</h1><p>Hello ${esc((S.me && S.me.display_name) || "")}. Your teacher needs to approve your account first.</p>
  <button class="pri" id="rf">Check again</button> <button id="lo">Log out</button></div></main>`;
  $("#rf").onclick = async () => { await loadMe(); if (S.me && S.me.approved) location.reload(); else toast("Not approved yet. Ask your teacher."); };
  $("#lo").onclick = logout;
}
async function logout() { await S.sb.auth.signOut(); location.hash = "#/login"; location.reload(); }
function setupScreen(onSave) {
  $("#app").innerHTML = `<main class="auth"><div class="card"><h1>Connect to Supabase</h1><p class="mut small">One time only. Find both in Supabase under Project Settings → API. The anon key is meant to be public.</p>
  <label for="su">Project URL</label><input id="su" placeholder="https://xxxxx.supabase.co"><label for="sk">anon public key</label><textarea id="sk" style="min-height:90px"></textarea>
  <div id="se" class="err" hidden></div><button class="pri" id="ss">Save and continue</button></div></main>`;
  $("#ss").onclick = () => { const url = $("#su").value.trim().replace(/\/$/, ""), key = $("#sk").value.trim(); if (!/^https:\/\/.+\.supabase\.co$/.test(url) || key.length < 40) { const e = $("#se"); e.textContent = "That does not look right. The URL ends in .supabase.co and the key is a long text."; e.hidden = false; return; } onSave({ url, key }); };
}

return { loadMe, authScreen, pendingScreen, logout, setupScreen };
})();

const __m_shell = (() => {
// The frame around every screen: sidebar (bottom bar on phones), who is logged in, and the nav for each role.
const { $, S, esc, isTeacher, here, diag, VERSION, dialog, toast, go, api } = __m_core;
