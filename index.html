const SQL=String.raw`-- AIMERS step 1: accounts, content tables, security rules. Safe to run more than once.
create table if not exists profiles(
  id uuid primary key references auth.users(id) on delete cascade,
  username text unique not null, display_name text not null,
  role text not null default 'student' check (role in ('student','teacher')),
  approved boolean not null default false, created_at timestamptz default now());
create table if not exists subjects(id text primary key, name text not null, position int default 0);
create table if not exists chapters(
  id uuid primary key default gen_random_uuid(), subject_id text references subjects(id) on delete cascade,
  number int not null, title text not null, intro text default '', unique(subject_id, number));
create table if not exists lessons(
  id uuid primary key default gen_random_uuid(), chapter_id uuid references chapters(id) on delete cascade,
  code text, title text not null, position int default 0,
  status text not null default 'empty' check (status in ('empty','draft','review','published')),
  content jsonb not null default '{}', source jsonb not null default '{}',
  video_drive text, video_youtube text, updated_at timestamptz default now(), published_at timestamptz);
create table if not exists lesson_scripts(  -- teacher-only: scripts students never see
  lesson_id uuid primary key references lessons(id) on delete cascade,
  mode text not null default 'none' check (mode in ('none','askalot','python')), script text default '');
alter table lesson_scripts add column if not exists draft jsonb;
create table if not exists lesson_versions(
  id bigserial primary key, lesson_id uuid, kind text, snapshot jsonb, saved_at timestamptz default now());
create table if not exists progress(
  user_id uuid references auth.users(id) on delete cascade, lesson_id uuid references lessons(id) on delete cascade,
  completed_at timestamptz default now(), primary key(user_id, lesson_id));

create or replace function is_teacher() returns boolean language sql stable security definer set search_path=public as
$$ select exists(select 1 from profiles where id=auth.uid() and role='teacher') $$;
create or replace function is_approved() returns boolean language sql stable security definer set search_path=public as
$$ select exists(select 1 from profiles where id=auth.uid() and approved) $$;

create or replace function handle_new_user() returns trigger language plpgsql security definer set search_path=public as $$
begin
  insert into profiles(id,username,display_name) values(new.id,
    coalesce(new.raw_user_meta_data->>'username', split_part(new.email,'@',1)),
    coalesce(new.raw_user_meta_data->>'display_name', split_part(new.email,'@',1)));
  return new;
end $$;
drop trigger if exists on_auth_user_created on auth.users;
create trigger on_auth_user_created after insert on auth.users for each row execute function handle_new_user();

create or replace function aimers_ready() returns json language sql stable security definer set search_path=public as
$$ select json_build_object('ready',true,'has_teacher',exists(select 1 from profiles where role='teacher')) $$;
create or replace function claim_teacher() returns boolean language plpgsql security definer set search_path=public as $$
begin
  if auth.uid() is null then raise exception 'not signed in'; end if;
  perform pg_advisory_xact_lock(4242);
  if exists(select 1 from profiles where role='teacher') then return false; end if;
  update profiles set role='teacher', approved=true where id=auth.uid();
  return true;
end $$;
revoke all on function claim_teacher() from public, anon;
grant execute on function aimers_ready() to anon, authenticated;
grant execute on function claim_teacher() to authenticated;

create or replace function lessons_touch() returns trigger language plpgsql as $$
begin
  new.updated_at=now();
  if new.status='published' and old.status<>'published' then new.published_at=now(); end if;
  return new;
end $$;
drop trigger if exists lessons_touch_t on lessons;
create trigger lessons_touch_t before update on lessons for each row execute function lessons_touch();

create or replace function save_version() returns trigger language plpgsql security definer set search_path=public as $$
begin
  if to_jsonb(old) is distinct from to_jsonb(new) then
    insert into lesson_versions(lesson_id,kind,snapshot)
    values(coalesce((to_jsonb(old)->>'lesson_id')::uuid,(to_jsonb(old)->>'id')::uuid), tg_argv[0], to_jsonb(old));
  end if;
  return new;
end $$;
drop trigger if exists lessons_ver on lessons;
create trigger lessons_ver before update on lessons for each row execute function save_version('lesson');
drop trigger if exists scripts_ver on lesson_scripts;
create trigger scripts_ver before update on lesson_scripts for each row execute function save_version('script');

alter table profiles enable row level security; alter table subjects enable row level security;
alter table chapters enable row level security; alter table lessons enable row level security;
alter table lesson_scripts enable row level security; alter table lesson_versions enable row level security;
alter table progress enable row level security;

drop policy if exists p_prof_sel on profiles; drop policy if exists p_prof_upd on profiles;
create policy p_prof_sel on profiles for select using (id=auth.uid() or is_teacher());
create policy p_prof_upd on profiles for update using (is_teacher()) with check (is_teacher());
drop policy if exists p_sub_sel on subjects; drop policy if exists p_sub_all on subjects;
create policy p_sub_sel on subjects for select using (is_approved() or is_teacher());
create policy p_sub_all on subjects for all using (is_teacher()) with check (is_teacher());
drop policy if exists p_ch_sel on chapters; drop policy if exists p_ch_all on chapters;
create policy p_ch_sel on chapters for select using (is_approved() or is_teacher());
create policy p_ch_all on chapters for all using (is_teacher()) with check (is_teacher());
drop policy if exists p_les_sel on lessons; drop policy if exists p_les_all on lessons;
create policy p_les_sel on lessons for select using (is_teacher() or (is_approved() and status='published'));
create policy p_les_all on lessons for all using (is_teacher()) with check (is_teacher());
drop policy if exists p_scr_all on lesson_scripts; create policy p_scr_all on lesson_scripts for all using (is_teacher()) with check (is_teacher());
drop policy if exists p_ver_sel on lesson_versions; create policy p_ver_sel on lesson_versions for select using (is_teacher());
drop policy if exists p_pro_own on progress; drop policy if exists p_pro_tch on progress;
create policy p_pro_own on progress for all using (user_id=auth.uid() and is_approved()) with check (user_id=auth.uid() and is_approved());
create policy p_pro_tch on progress for select using (is_teacher());

insert into subjects(id,name,position) values('math','Mathematics',1),('sci','Science',2),('sst','Social Science',3),('eng','English',4) on conflict do nothing;
insert into chapters(subject_id,number,title) values
('math',1,'Real Numbers'),('math',2,'Polynomials'),('math',3,'Pair of Linear Equations in Two Variables'),('math',4,'Quadratic Equations'),
('math',5,'Arithmetic Progressions'),('math',6,'Triangles'),('math',7,'Coordinate Geometry'),('math',8,'Introduction to Trigonometry'),
('math',9,'Some Applications of Trigonometry'),('math',10,'Circles'),('math',11,'Areas Related to Circles'),
('math',12,'Surface Areas and Volumes'),('math',13,'Statistics'),('math',14,'Probability') on conflict do nothing;

-- STEP3: question bank, student answers, quiz results
create table if not exists questions(
  id uuid primary key default gen_random_uuid(), chapter_id uuid references chapters(id) on delete cascade,
  qtype text not null check (qtype in ('mcq','ar','vsa','sa','la','case')), marks int not null default 1,
  importance text not null default 'practice', q text not null, options jsonb, answer text not null default '',
  scheme text default '', explain text default '', status text not null default 'draft' check (status in ('draft','approved')),
  created_at timestamptz default now());
create table if not exists student_answers(
  user_id uuid references auth.users(id) on delete cascade, question_id uuid references questions(id) on delete cascade,
  answer text default '', updated_at timestamptz default now(), primary key(user_id, question_id));
create table if not exists quiz_attempts(
  id bigserial primary key, user_id uuid references auth.users(id) on delete cascade, chapter_id uuid,
  score int, total int, created_at timestamptz default now());
alter table questions enable row level security; alter table student_answers enable row level security; alter table quiz_attempts enable row level security;
drop policy if exists p_q_sel on questions; drop policy if exists p_q_all on questions;
create policy p_q_sel on questions for select using (is_teacher() or (is_approved() and status='approved'));
create policy p_q_all on questions for all using (is_teacher()) with check (is_teacher());
drop policy if exists p_a_own on student_answers; drop policy if exists p_a_tch on student_answers;
create policy p_a_own on student_answers for all using (user_id=auth.uid() and is_approved()) with check (user_id=auth.uid() and is_approved());
create policy p_a_tch on student_answers for select using (is_teacher());
drop policy if exists p_z_own on quiz_attempts; drop policy if exists p_z_ins on quiz_attempts; drop policy if exists p_z_tch on quiz_attempts;
create policy p_z_own on quiz_attempts for select using (user_id=auth.uid());
create policy p_z_ins on quiz_attempts for insert with check (user_id=auth.uid() and is_approved());
create policy p_z_tch on quiz_attempts for select using (is_teacher());

-- STEP4: activity log, mood ratings, tests
create table if not exists activity_log(id bigserial primary key, user_id uuid references auth.users(id) on delete cascade, kind text, ref uuid, seconds int default 0, created_at timestamptz default now());
create table if not exists moods(id bigserial primary key, user_id uuid references auth.users(id) on delete cascade, kind text, ref uuid, mood int check (mood between 1 and 3), note text, created_at timestamptz default now());
create table if not exists tests(id uuid primary key default gen_random_uuid(), title text not null, chapter_ids jsonb, total_marks int, minutes int default 60, question_ids jsonb not null, published boolean default false, created_at timestamptz default now());
create table if not exists test_attempts(id uuid primary key default gen_random_uuid(), test_id uuid references tests(id) on delete cascade, user_id uuid references auth.users(id) on delete cascade,
  answers jsonb not null default '{}', status text not null default 'in_progress' check (status in ('in_progress','submitted','reviewed')), scores jsonb default '{}',
  auto_score int default 0, total int default 0, final_score numeric, leaves int default 0, feedback text, started_at timestamptz default now(), submitted_at timestamptz, unique(test_id,user_id));
alter table activity_log enable row level security; alter table moods enable row level security; alter table tests enable row level security; alter table test_attempts enable row level security;
drop policy if exists p_al_ins on activity_log; drop policy if exists p_al_sel on activity_log;
create policy p_al_ins on activity_log for insert with check (user_id=auth.uid() and is_approved());
create policy p_al_sel on activity_log for select using (user_id=auth.uid() or is_teacher());
drop policy if exists p_mo_ins on moods; drop policy if exists p_mo_sel on moods;
create policy p_mo_ins on moods for insert with check (user_id=auth.uid() and is_approved());
create policy p_mo_sel on moods for select using (user_id=auth.uid() or is_teacher());
drop policy if exists p_t_sel on tests; drop policy if exists p_t_all on tests;
create policy p_t_sel on tests for select using (is_teacher() or (is_approved() and published));
create policy p_t_all on tests for all using (is_teacher()) with check (is_teacher());
drop policy if exists p_ta_sel on test_attempts; drop policy if exists p_ta_ins on test_attempts; drop policy if exists p_ta_upd on test_attempts; drop policy if exists p_ta_all on test_attempts;
create policy p_ta_sel on test_attempts for select using (user_id=auth.uid() or is_teacher());
create policy p_ta_ins on test_attempts for insert with check (user_id=auth.uid() and is_approved() and status='in_progress' and final_score is null);
create policy p_ta_upd on test_attempts for update using (user_id=auth.uid() and status='in_progress') with check (user_id=auth.uid());
create policy p_ta_all on test_attempts for all using (is_teacher()) with check (is_teacher());
create or replace function guard_attempt() returns trigger language plpgsql as $$
begin
  if not is_teacher() and coalesce(current_setting('aimers.rpc',true),'')<>'on' then
    new.scores=old.scores; new.auto_score=old.auto_score; new.total=old.total; new.final_score=old.final_score; new.feedback=old.feedback;
    new.status=old.status; new.submitted_at=old.submitted_at; new.test_id=old.test_id; new.user_id=old.user_id; new.started_at=old.started_at;
  end if;
  return new;
end $$;
drop trigger if exists guard_attempt_t on test_attempts;
create trigger guard_attempt_t before update on test_attempts for each row execute function guard_attempt();
create or replace function submit_attempt(aid uuid) returns json language plpgsql security definer set search_path=public as $$
declare a test_attempts%rowtype; s int:=0; t int:=0; m int:=0; q record;
begin
  select * into a from test_attempts where id=aid and user_id=auth.uid() and status='in_progress';
  if not found then raise exception 'attempt not found or already submitted'; end if;
  for q in select * from questions where id in (select (jsonb_array_elements_text((select question_ids from tests where id=a.test_id)))::uuid) loop
    t:=t+q.marks;
    if q.qtype in ('mcq','ar') then if a.answers->>(q.id::text)=q.answer then s:=s+q.marks; end if; else m:=m+1; end if;
  end loop;
  perform set_config('aimers.rpc','on',true);
  update test_attempts set auto_score=s, total=t, status=case when m=0 then 'reviewed' else 'submitted' end,
    final_score=case when m=0 then s end, submitted_at=now() where id=aid;
  return json_build_object('auto',s,'total',t,'manual',m);
end $$;
grant execute on function submit_attempt(uuid) to authenticated;

-- STEP5: more auto-marked question formats (true/false, fill in the blank, numerical)
alter table questions drop constraint if exists questions_qtype_check;
alter table questions add constraint questions_qtype_check check (qtype in ('mcq','ar','tf','fill','num','vsa','sa','la','case'));
create or replace function submit_attempt(aid uuid) returns json language plpgsql security definer set search_path=public as $$
declare a test_attempts%rowtype; s int:=0; t int:=0; m int:=0; q record; ans text; hit boolean;
begin
  select * into a from test_attempts where id=aid and user_id=auth.uid() and status='in_progress';
  if not found then raise exception 'attempt not found or already submitted'; end if;
  for q in select * from questions where id in (select (jsonb_array_elements_text((select question_ids from tests where id=a.test_id)))::uuid) loop
    t:=t+q.marks;
    if q.qtype in ('mcq','ar','tf','fill','num') then
      ans:=lower(trim(coalesce(a.answers->>(q.id::text),'')));
      select exists(select 1 from unnest(string_to_array(lower(q.answer),'|')) x where ans<>'' and (trim(x)=ans or
        case when q.qtype='num' and ans ~ '^-?[0-9]+(\.[0-9]+)?$' and trim(x) ~ '^-?[0-9]+(\.[0-9]+)?$'
          then abs(ans::numeric-trim(x)::numeric)<=greatest(0.01,abs(trim(x)::numeric)*0.001) else false end)) into hit;
      if hit then s:=s+q.marks; end if;
    else m:=m+1; end if;
  end loop;
  perform set_config('aimers.rpc','on',true);
  update test_attempts set auto_score=s, total=t, status=case when m=0 then 'reviewed' else 'submitted' end,
    final_score=case when m=0 then s end, submitted_at=now() where id=aid;
  return json_build_object('auto',s,'total',t,'manual',m);
end $$;
grant execute on function submit_attempt(uuid) to authenticated;

-- STEP6: NCERT library (PDFs for students, extracted text for the teacher's AI prompts)
create table if not exists chapter_files(chapter_id uuid primary key references chapters(id) on delete cascade, path text not null, name text, size bigint, updated_at timestamptz default now());
create table if not exists chapter_text(chapter_id uuid primary key references chapters(id) on delete cascade, body text not null, pages int, updated_at timestamptz default now());
alter table chapter_files enable row level security; alter table chapter_text enable row level security;
drop policy if exists p_cf_sel on chapter_files; drop policy if exists p_cf_all on chapter_files; drop policy if exists p_ct_all on chapter_text;
create policy p_cf_sel on chapter_files for select using (is_approved() or is_teacher());
create policy p_cf_all on chapter_files for all using (is_teacher()) with check (is_teacher());
create policy p_ct_all on chapter_text for all using (is_teacher()) with check (is_teacher());
insert into storage.buckets(id,name,public) values('ncert','ncert',false) on conflict (id) do nothing;
drop policy if exists "ncert read" on storage.objects; drop policy if exists "ncert insert" on storage.objects; drop policy if exists "ncert update" on storage.objects; drop policy if exists "ncert delete" on storage.objects;
create policy "ncert read" on storage.objects for select using (bucket_id='ncert' and (is_teacher() or is_approved()));
create policy "ncert insert" on storage.objects for insert with check (bucket_id='ncert' and is_teacher());
create policy "ncert update" on storage.objects for update using (bucket_id='ncert' and is_teacher());
create policy "ncert delete" on storage.objects for delete using (bucket_id='ncert' and is_teacher());

-- STEP7: Social Science in four parts and English in two books (old empty "Social Science" and "English" are removed)
insert into subjects(id,name,position) values
 ('hist','Social Science: History',3),('geo','Social Science: Geography',4),('pol','Social Science: Political Science',5),('eco','Social Science: Economics',6),
 ('ff','English: First Flight',7),('fwf','English: Footprints Without Feet',8) on conflict (id) do nothing;
delete from subjects s where s.id in ('sst','eng') and not exists (select 1 from chapters c where c.subject_id=s.id);

-- STEP8: static vs AI-made questions, a record of every answer, AI-marking comparison
alter table questions add column if not exists origin text not null default 'ai';
alter table test_attempts add column if not exists ai_scores jsonb;
create table if not exists question_attempts(id bigserial primary key, user_id uuid references auth.users(id) on delete cascade, question_id uuid references questions(id) on delete set null,
  mode text, answer text, correct boolean, marks numeric, max_marks numeric, origin text, chapter_id uuid, created_at timestamptz default now());
alter table question_attempts enable row level security;
drop policy if exists p_qa_sel on question_attempts; drop policy if exists p_qa_tch on question_attempts;
create policy p_qa_sel on question_attempts for select using (user_id=auth.uid());
create policy p_qa_tch on question_attempts for all using (is_teacher()) with check (is_teacher());
create or replace function q_correct(qt text, ans text, stored text) returns boolean language plpgsql immutable as $$
declare a text:=lower(trim(coalesce(ans,''))); x text;
begin
  if a='' then return false; end if;
  foreach x in array string_to_array(lower(coalesce(stored,'')),'|') loop
    x:=trim(x);
    if x=a then return true; end if;
    if qt='num' and a ~ '^-?[0-9]+(\.[0-9]+)?$' and x ~ '^-?[0-9]+(\.[0-9]+)?$' then
      if abs(a::numeric-x::numeric)<=greatest(0.01,abs(x::numeric)*0.001) then return true; end if;
    end if;
  end loop;
  return false;
end $$;
create or replace function log_answers(m text, items jsonb) returns int language plpgsql security definer set search_path=public as $$
declare it jsonb; q questions%rowtype; ok boolean; n int:=0;
begin
  if auth.uid() is null or not is_approved() then raise exception 'not allowed'; end if;

create or replace function submit_attempt(aid uuid) returns json language plpgsql security definer set search_path=public as $$
declare a test_attempts%rowtype; s int:=0; t int:=0; m int:=0; q record; ok boolean;
begin
  select * into a from test_attempts where id=aid and user_id=auth.uid() and status='in_progress';
  if not found then raise exception 'attempt not found or already submitted'; end if;
  for q in select * from questions where id in (select (jsonb_array_elements_text((select question_ids from tests where id=a.test_id)))::uuid) loop
    t:=t+q.marks;
    if q.qtype in ('mcq','ar','tf','fill','num') then
      ok:=q_correct(q.qtype,a.answers->>(q.id::text),q.answer);
      if ok then s:=s+q.marks; end if;
      insert into question_attempts(user_id,question_id,mode,answer,correct,marks,max_marks,origin,chapter_id)
        values(a.user_id,q.id,'test',a.answers->>(q.id::text),ok,case when ok then q.marks else 0 end,q.marks,q.origin,q.chapter_id);
    else
      m:=m+1;
      insert into question_attempts(user_id,question_id,mode,answer,correct,marks,max_marks,origin,chapter_id)
        values(a.user_id,q.id,'test',a.answers->>(q.id::text),null,null,q.marks,q.origin,q.chapter_id);
    end if;
  end loop;
  perform set_config('aimers.rpc','on',true);
  update test_attempts set auto_score=s, total=t, status=case when m=0 then 'reviewed' else 'submitted' end,
    final_score=case when m=0 then s end, submitted_at=now() where id=aid;
  return json_build_object('auto',s,'total',t,'manual',m);
end $$;

const SQL5=String.raw`-- STEP5: more auto-marked question formats (true/false, fill in the blank, numerical)
alter table questions drop constraint if exists questions_qtype_check;
alter table questions add constraint questions_qtype_check check (qtype in ('mcq','ar','tf','fill','num','vsa','sa','la','case'));
create or replace function submit_attempt(aid uuid) returns json language plpgsql security definer set search_path=public as $$
declare a test_attempts%rowtype; s int:=0; t int:=0; m int:=0; q record; ans text; hit boolean;
begin
  select * into a from test_attempts where id=aid and user_id=auth.uid() and status='in_progress';
  if not found then raise exception 'attempt not found or already submitted'; end if;
  for q in select * from questions where id in (select (jsonb_array_elements_text((select question_ids from tests where id=a.test_id)))::uuid) loop
    t:=t+q.marks;
    if q.qtype in ('mcq','ar','tf','fill','num') then
      ans:=lower(trim(coalesce(a.answers->>(q.id::text),'')));
      select exists(select 1 from unnest(string_to_array(lower(q.answer),'|')) x where ans<>'' and (trim(x)=ans or
        case when q.qtype='num' and ans ~ '^-?[0-9]+(\.[0-9]+)?$' and trim(x) ~ '^-?[0-9]+(\.[0-9]+)?$'
          then abs(ans::numeric-trim(x)::numeric)<=greatest(0.01,abs(trim(x)::numeric)*0.001) else false end)) into hit;
      if hit then s:=s+q.marks; end if;
    else m:=m+1; end if;
  end loop;
  perform set_config('aimers.rpc','on',true);
  update test_attempts set auto_score=s, total=t, status=case when m=0 then 'reviewed' else 'submitted' end,
    final_score=case when m=0 then s end, submitted_at=now() where id=aid;
  return json_build_object('auto',s,'total',t,'manual',m);
end $$;
grant execute on function submit_attempt(uuid) to authenticated;

begin
  if not is_teacher() and coalesce(current_setting('aimers.rpc',true),'')<>'on' then

 ['title','thumb','desc','keywords','scenes'].forEach(k=>ok(C[k]!=null,`CONTENT is missing "${k}".`));if(!C.no_hook)ok(C.hook,'Add "no_hook": true, or a "hook" with title and say.');

 if((C.title||'').length>70)note.push(`The title is ${C.title.length} characters (aim for 70 or fewer).`);if((C.desc||'').length<80)note.push('The description is short; put keywords in its first 150 characters.');
 S.forEach((s,i)=>{const n=`Scene ${i+1}${s.name?` (${s.name})`:''}`;ok(AK.types.includes(s.type),`${n}: unknown type "${s.type}".`);
  ok(Array.isArray(s.say)&&s.say.length,`${n}: needs "say", a list of sentences.`);(s.say||[]).forEach(x=>{sents++;words+=String(x).split(/\s+/).length;if(x.length>190)err.push(`${n}: a sentence is over 190 characters.`);else if(x.length>120)note.push(`${n}: a sentence is over 120 characters; shorter gives cleaner captions.`)});
  if(Array.isArray(s.emo)){if(s.emo.length!=(s.say||[]).length)note.push(`${n}: "emo" has ${s.emo.length} items for ${(s.say||[]).length} sentences.`);s.emo.forEach(e=>{if(!AK.emo.includes(e))note.push(`${n}: emotion "${e}" is not standard; the engine will guess one.`)})}

  const t=s.type;if(t=='equation')ok(s.eq,`${n}: equation needs "eq".`);if(t=='slam')ok(s.words,`${n}: slam needs "words".`);if(t=='bars')ok(s.bars,`${n}: bars needs "bars".`);if(t=='timeline')ok(s.events,`${n}: timeline needs "events".`);

  if(t=='history'){ok(Array.isArray(s.nodes)&&s.nodes.length,`${n}: history needs "nodes".`);(s.nodes||[]).forEach(x=>ok(x.year&&x.name,`${n}: each history node needs "year" and "name".`));if((s.nodes||[]).length>8)note.push(`${n}: history shows at most 8 nodes.`)}
  if(t=='stage'){ok(Array.isArray(s.beats)&&s.beats.length,`${n}: stage needs "beats".`);ok(AK.bg.includes(s.bg||'orchard'),`${n}: bg must be one of ${AK.bg.join(', ')}.`);const ids=new Set();
   (s.beats||[]).forEach(b=>{ok(AK.arm.includes(b.arm||'idle'),`${n}: arm must be one of ${AK.arm.join(', ')}.`);(b.props||[]).forEach(p=>{ok(p.id,`${n}: every prop needs an "id".`);
    if(p.kind){ok(AK.props.includes(p.kind),`${n}: prop kind must be one of ${AK.props.join(', ')}.`);ok(p.x!=null&&p.y!=null,`${n}: prop "${p.id}" needs x and y.`);ids.add(p.id)}else{ok(['move','orbit','hide'].includes(p.do),`${n}: a prop change needs do = move, orbit or hide.`);ok(ids.has(p.id),`${n}: prop "${p.id}" is used before it is created.`)}})})}});

create or replace function q_correct(qt text, ans text, stored text) returns boolean language plpgsql immutable as $$
declare a text:=lower(trim(coalesce(ans,''))); x text;
begin
  if a='' then return false; end if;
  foreach x in array string_to_array(lower(coalesce(stored,'')),'|') loop
    x:=trim(x);
    if x=a then return true; end if;
    if qt='num' and a ~ '^-?[0-9]+(\.[0-9]+)?$' and x ~ '^-?[0-9]+(\.[0-9]+)?$' then
      if abs(a::numeric-x::numeric)<=greatest(0.01,abs(x::numeric)*0.001) then return true; end if;
    end if;
  end loop;
  return false;
end $$;
create or replace function log_answers(m text, items jsonb) returns int language plpgsql security definer set search_path=public as $$
declare it jsonb; q questions%rowtype; ok boolean; n int:=0;
begin
  if auth.uid() is null or not is_approved() then raise exception 'not allowed'; end if;
  if m not in ('quiz','practice') then raise exception 'bad mode'; end if;
  for it in select * from jsonb_array_elements(items) loop
    select * into q from questions where id=(it->>'q')::uuid and status='approved' and qtype in ('mcq','ar','tf','fill','num');
    if found then
      ok:=q_correct(q.qtype,it->>'a',q.answer);
      insert into question_attempts(user_id,question_id,mode,answer,correct,marks,max_marks,origin,chapter_id)
        values(auth.uid(),q.id,m,it->>'a',ok,case when ok then q.marks else 0 end,q.marks,q.origin,q.chapter_id);
      n:=n+1;
    end if;
  end loop;
  return n;
end $$;
grant execute on function log_answers(text,jsonb) to authenticated;
create or replace function submit_attempt(aid uuid) returns json language plpgsql security definer set search_path=public as $$
declare a test_attempts%rowtype; s int:=0; t int:=0; m int:=0; q record; ok boolean;
begin
  select * into a from test_attempts where id=aid and user_id=auth.uid() and status='in_progress';
  if not found then raise exception 'attempt not found or already submitted'; end if;
  for q in select * from questions where id in (select (jsonb_array_elements_text((select question_ids from tests where id=a.test_id)))::uuid) loop
    t:=t+q.marks;
    if q.qtype in ('mcq','ar','tf','fill','num') then
      ok:=q_correct(q.qtype,a.answers->>(q.id::text),q.answer);
      if ok then s:=s+q.marks; end if;
      insert into question_attempts(user_id,question_id,mode,answer,correct,marks,max_marks,origin,chapter_id)
        values(a.user_id,q.id,'test',a.answers->>(q.id::text),ok,case when ok then q.marks else 0 end,q.marks,q.origin,q.chapter_id);
    else
      m:=m+1;
      insert into question_attempts(user_id,question_id,mode,answer,correct,marks,max_marks,origin,chapter_id)
        values(a.user_id,q.id,'test',a.answers->>(q.id::text),null,null,q.marks,q.origin,q.chapter_id);
    end if;
  end loop;
  perform set_config('aimers.rpc','on',true);
  update test_attempts set auto_score=s, total=t, status=case when m=0 then 'reviewed' else 'submitted' end,
    final_score=case when m=0 then s end, submitted_at=now() where id=aid;
  return json_build_object('auto',s,'total',t,'manual',m);
end $$;
grant execute on function submit_attempt(uuid) to authenticated;
`;

 const wr=(sa.data||[]).filter(x=>(x.answer||'').trim()),ws=wr.filter(x=>x.questions?.origin=='static').length,bs={};

 show(`<div class="crumb"><a onclick="S.sd=null;draw()">All students</a></div><h1>${esc(p.data?.display_name||'Student')}</h1><p class="note">Username: ${esc(p.data?.username||'')}</p>
 <div class="grid">${card('Static questions',st)}${card('AI-made questions',ai)}<div class="card"><h3>Written practice answers</h3><b style="font-size:26px">${wr.length}</b> started<br><span class="note">${ws} static, ${wr.length-ws} AI-made</span></div></div>
 <h2>By subject</h2>${Object.keys(bs).map(k=>`<div class="card row" style="justify-content:space-between"><span>${esc(k)}</span><span>${bs[k].c} of ${bs[k].n} correct (${pct(bs[k].c,bs[k].n)}%)</span></div>`).join('')||'<div class="card note">Nothing solved yet.</div>'}
 <h2>AI marking compared with your marks</h2><div class="card note">${diffs.length?`${diffs.length} written answers were AI-marked and then marked by you. On average the AI was ${(diffs.reduce((a,b)=>a+b,0)/diffs.length).toFixed(2)} marks away from your final mark, and agreed exactly on ${pct(diffs.filter(d=>d==0).length,diffs.length)}%.`:'No AI-assisted marking recorded yet.'}</div>
 <h2>Recent quizzes</h2>${(qz.data||[]).map(x=>`<div class="card row" style="justify-content:space-between"><span>${new Date(x.created_at).toLocaleString()}</span><b>${x.score} / ${x.total}</b></div>`).join('')||'<div class="card note">None yet.</div>'}
 <h2>Every answer (latest 100)</h2>${A.slice(0,100).map(x=>`<div class="card"><span class="pill">${md[x.mode]||x.mode}</span> <span class="pill ${x.origin=='static'?'':'d'}">${x.origin=='static'?'Static':'AI-made'}</span> ${x.correct==null?'<span class="pill d">awaiting marks</span>':x.correct?'<span class="pill">correct</span>':'<span class="pill d">wrong</span>'}<div style="margin-top:6px">${esc((x.questions?.q||'(question deleted)').slice(0,140))}</div><div class="note">Answered: <b>${esc(x.answer||'(blank)')}</b> · Correct: ${esc(x.questions?.answer||'')} · ${x.marks??'-'} of ${x.max_marks} marks · ${new Date(x.created_at).toLocaleString()}</div></div>`).join('')||'<div class="card note">No answers recorded yet.</div>'}`)}
